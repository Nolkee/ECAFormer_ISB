name: ISB_ecaformer_r53b_auto_engage
model_type: ImageISBModel
scale: 1
num_gpu: 1
manual_seed: 100

# R53b = R53a + AUTO engage — turn r52b's luck into a mechanism.
#
# The transition timing is stochastic (identical configs crashed at 5.5K vs
# 7.5K). r52b's record came from its 9K engage landing at the valley bottom;
# r52a's 12K engage landed after the peak and locked a declined state. A
# fixed iter cannot reliably hit the window.
#
# auto: watch the train-PSNR EMA (tau~100); valley = 1.0 dB below running
# peak; engage when the EMA rises 0.5 dB off the valley bottom (early
# recovery = the r52b-winning timing; simulated on all three observed
# timelines it fires at 7.1K/9.0K/7.2K respectively). anchor_start_iter
# becomes a hard CAP (12000) for no-valley runs and state-lost resumes;
# engage state + frozen ratio persist in latest.state (model_extra).
# anchor_freeze_delay 1500: the ratio target keeps trailing for 1.5K iters
# after engage so the lock lands on the settled regime, not mid-recovery.

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Train/target
    dataroot_lq: data/LOLv1/Train/input
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 8
    dataset_enlarge_ratio: 1
    batch_size_per_gpu: 24
    mini_batch_sizes: [24]
    iters: [24000]
    gt_size: 128
    gt_sizes: [128]
    prefetch_mode: ~
  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Test/target
    dataroot_lq: data/LOLv1/Test/input
    io_backend:
      type: disk

network_g:
  type: ECAFormerISB
  in_channels: 3
  out_channels: 3
  n_feat: 80
  level: 2
  num_blocks: [1, 2, 2]
  nfe: 8
  min_nfe_for_stability: 8
  sigma_max: 0.10
  use_checkpoint: true
  use_sb: true
  self_cond_prob: 0.0
  cond_type: adaln
  output_activation: identity
  train_output_clamp: true
  inference_output_clamp: true
  reverse_noise_scale: 0.0
  use_out_norm: true
  mapping_bias: true
  pre_denoiser_x1_clamp: false
  residual_scale_init: 0.6
  channel_scale_init: [1.0, 1.0, 1.0]
  illumination_channels: 3
  use_eca: true
  eca_gamma: 1.5
  eca_beta: 1
  channel_noise_scale: [1.0, 0.8, 1.0]  # R48b winner: reduce green bridge noise
  residual_gray_world: true       # green fix, now scheduled:
  gray_world_decay_start: 1500    # full WB until here (green-risk phase)
  gray_world_decay_end: 3500      # raw x1 from here on (R48b color regime)

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 24000
  warmup_iter: 1000
  use_grad_clip: true
  grad_clip_value: 0.02
  use_amp: true
  accumulate_steps: 1
  ema_decay: 0.999
  ema_warmup: true  # G1: early validation reflects the live net
  bridge_weight: 1.0
  x0_loss_weight: 0.4
  pixel_loss_weight: 0.6
  tv_loss_weight: 0.002
  color_loss_weight: 0.2
  chroma_loss_weight: 0.05
  anchor_loss_weight: 0.5
  anchor_mode: x1_ema        # R52: self-calibrating target (EMA of achieved x1/lq ratio)
  anchor_ema_momentum: 0.99
  anchor_deadzone: 0.0       # R53: exact lock — the 0.05 band let the -0.76 dB sag escape
  anchor_start_iter: 12000   # AUTO mode: hard cap / resume fallback, not the trigger
  anchor_engage_mode: auto   # engage at the recovery turn (train-PSNR EMA based)
  anchor_valley_drop: 1.0
  anchor_rise_margin: 0.5
  anchor_min_engage_iter: 4000
  anchor_freeze_delay: 1500  # trail the settling regime, then freeze
  strict_output_range: true
  loss_on_clamped_output: true
  nan_guard: true
  output_range_log_interval: 500
  train_psnr_window: 512
  psnr_gap_warn: 2.0
  early_stop_patience_val: 12
  early_stop_min_delta: 0.005
  max_nan_skips_per_epoch: 3
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [24000]
    restart_weights: [1]
    eta_min: !!float 1e-6
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: !!float 6e-5
    betas: [0.9, 0.999]
    weight_decay: !!float 0.05
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3
  perceptual_opt:
    type: VGGPerceptualLoss
    loss_weight: 0.1

val:
  window_size: 4
  val_freq: !!float 500
  save_img: false  # disk-safe: code saves baseline once + best_results overwrite only
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    lpips:
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false
      net: alex
      use_gpu: true

logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 2000
  use_tb_logger: true
  wandb:
    project: low_light_isb
    resume_id: ~
dist_params:
  backend: nccl
  port: 29500
