name: ISB_ecaformer_r50a_gw_decay
model_type: ImageISBModel
scale: 1
num_gpu: 1
manual_seed: 100

# R50a = R49a with the gray-world residual DECAYED instead of permanent.
#
# R49 verdict (2026-07-14): the green fix worked (iter-500 images neutral) but
# always-on WB caused two regressions:
#   1. Desaturation — the residual carries zero per-image mean chroma forever;
#      mapping (behind GroupNorm) can only supply a dataset-constant DC color,
#      so converged outputs wash toward the dataset-average cast.
#   2. Earlier crash (5.5-7K vs R48b's 7-9.5K) — the detached reciprocal gains
#      (gray/ch_mean, ch_mean~0.05-0.1) amplify estimator drift into large
#      residual-base swings; dim channels get effective residual scale up to
#      1.2 (0.6 * gain cap 2.0).
#
# Fix: blend lambda decays 1 -> 0 over iters [1500, 3500]. Full WB through the
# green-risk phase (mapping ~= 0), raw x1 (R48b regime, natural color cast)
# restored well before the 5.5K danger window. Same lambda in train and val at
# any iter (propagated via _current_iter to net_g AND net_g_ema); deployment
# inference (no iter context) uses the terminal state lambda=0.
#
# Expected: iter-500 baseline NOT green; NO desaturation at best checkpoints;
# crash timing reverts to R48b-like (7-9.5K) — r50b/r50c then target the crash.

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Train/target
    dataroot_lq: data/LOLv1/Train/input
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 8
    dataset_enlarge_ratio: 1
    batch_size_per_gpu: 24
    mini_batch_sizes: [24]
    iters: [24000]
    gt_size: 128
    gt_sizes: [128]
    prefetch_mode: ~
  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Test/target
    dataroot_lq: data/LOLv1/Test/input
    io_backend:
      type: disk

network_g:
  type: ECAFormerISB
  in_channels: 3
  out_channels: 3
  n_feat: 80
  level: 2
  num_blocks: [1, 2, 2]
  nfe: 8
  min_nfe_for_stability: 8
  sigma_max: 0.10
  use_checkpoint: true
  use_sb: true
  self_cond_prob: 0.0
  cond_type: adaln
  output_activation: identity
  train_output_clamp: true
  inference_output_clamp: true
  reverse_noise_scale: 0.0
  use_out_norm: true
  mapping_bias: true
  pre_denoiser_x1_clamp: false
  residual_scale_init: 0.6
  channel_scale_init: [1.0, 1.0, 1.0]
  illumination_channels: 3
  use_eca: true
  eca_gamma: 1.5
  eca_beta: 1
  channel_noise_scale: [1.0, 0.8, 1.0]  # R48b winner: reduce green bridge noise
  residual_gray_world: true       # green fix, now scheduled:
  gray_world_decay_start: 1500    # full WB until here (green-risk phase)
  gray_world_decay_end: 3500      # raw x1 from here on (R48b color regime)

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 24000
  warmup_iter: 1000
  use_grad_clip: true
  grad_clip_value: 0.02
  use_amp: true
  accumulate_steps: 1
  ema_decay: 0.999
  ema_warmup: true  # G1: early validation reflects the live net
  bridge_weight: 1.0
  x0_loss_weight: 0.4
  pixel_loss_weight: 0.6
  tv_loss_weight: 0.002
  color_loss_weight: 0.2
  chroma_loss_weight: 0.05
  strict_output_range: true
  loss_on_clamped_output: true
  nan_guard: true
  output_range_log_interval: 500
  train_psnr_window: 512
  psnr_gap_warn: 2.0
  early_stop_patience_val: 8
  early_stop_min_delta: 0.005
  max_nan_skips_per_epoch: 3
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [24000]
    restart_weights: [1]
    eta_min: !!float 1e-6
  mixing_augs:
    mixup: true
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: AdamW
    lr: !!float 6e-5
    betas: [0.9, 0.999]
    weight_decay: !!float 0.05
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3
  perceptual_opt:
    type: VGGPerceptualLoss
    loss_weight: 0.1

val:
  window_size: 4
  val_freq: !!float 500
  save_img: false  # disk-safe: code saves baseline once + best_results overwrite only
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    lpips:
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false
      net: alex
      use_gpu: true

logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 2000
  use_tb_logger: true
  wandb:
    project: low_light_isb
    resume_id: ~
dist_params:
  backend: nccl
  port: 29500
