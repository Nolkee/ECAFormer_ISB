name: ECAFormer_baseline_lolv1_fair24k
model_type: ImageCleanModel
scale: 1
num_gpu: 1
manual_seed: 100

# MATCHED-BUDGET fair baseline (paper control row).
#
# Protocol matched to the ISB champion r52b: same data, same batch (24), same
# patch (128), same iter budget (24K), same val cadence (500) and early-stop
# rule (patience 8), same backbone width (n_feat 80) and ECA settings
# (use_eca / eca_gamma 1.5 — backbone parity with r52b's denoiser).
# Optimizer stays the baseline's own known-good recipe (Adam 2e-4, no mixup):
# matched budget + own-best recipe, documented in paper_pack/NOTES.md.
#
# This run answers two questions the old 250K-protocol baseline
# (ECAFormer_baseline_lolv1_fair_paper, 23.26/0.8376/0.0882 @45K with ~5.2x
# the pixel budget of r52b's peak) cannot:
#   1. At matched compute, does the bridge win PSNR (curve says +1.1 dB)?
#   2. Is the 2x LPIPS gap (0.088 vs 0.166) a patch-256 protocol effect or a
#      structural cost of the bridge? (This run trains at patch 128.)

datasets:
  train:
    name: TrainSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Train/target
    dataroot_lq: data/LOLv1/Train/input
    geometric_augs: true
    filename_tmpl: '{}'
    io_backend:
      type: disk
    use_shuffle: true
    num_worker_per_gpu: 8
    dataset_enlarge_ratio: 1
    batch_size_per_gpu: 24
    mini_batch_sizes: [24]
    iters: [24000]
    gt_size: 128
    gt_sizes: [128]
    prefetch_mode: ~
  val:
    name: ValSet
    type: Dataset_PairedImage
    dataroot_gt: data/LOLv1/Test/target
    dataroot_lq: data/LOLv1/Test/input
    io_backend:
      type: disk

network_g:
  type: ECAFormerBaseline
  in_channels: 3
  out_channels: 3
  n_feat: 80
  level: 2
  num_blocks: [1, 2, 2]
  stage: 1
  use_eca: true
  eca_gamma: 1.5
  eca_beta: 1

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  total_iter: 24000
  warmup_iter: 1000
  use_grad_clip: true
  grad_clip_value: 0.02
  use_amp: true
  ema_decay: 0.999
  ema_warmup: true
  early_stop_patience_val: 8
  early_stop_min_delta: 0.005
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [24000]
    restart_weights: [1]
    eta_min: !!float 1e-6
  mixing_augs:
    mixup: false
    mixup_beta: 1.2
    use_identity: true
  optim_g:
    type: Adam
    lr: !!float 2e-4
    betas: [0.9, 0.999]
  pixel_opt:
    type: CharbonnierLoss
    loss_weight: 1.0
    reduction: mean
    eps: !!float 1e-3
  perceptual_opt:
    type: VGGPerceptualLoss
    loss_weight: 0.1

val:
  window_size: 4
  val_freq: !!float 500
  save_img: false
  rgb2bgr: true
  use_image: false
  max_minibatch: 8
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false
    lpips:
      type: calculate_lpips
      crop_border: 0
      test_y_channel: false
      net: alex
      use_gpu: true

logger:
  print_freq: 1000
  save_checkpoint_freq: !!float 2000
  use_tb_logger: true
  wandb:
    project: low_light_isb
    resume_id: ~

dist_params:
  backend: nccl
  port: 29500
